<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020409">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skyfall">
<meta name="description" content="Skyfall — sci-fi HUD weather with live station data, golf forecasts and a sarcastic comms feed.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://air-quality-api.open-meteo.com https://geocoding-api.open-meteo.com https://pollen.googleapis.com https://api.bigdatacloud.net https://generativelanguage.googleapis.com https://texttospeech.googleapis.com; media-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Skyfall</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css?v=33">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="scrim" aria-hidden="true"></div>
<div id="grid" aria-hidden="true"></div>

<div id="boot" aria-hidden="true"><div class="boot-lines"></div></div>

<header id="top">
  <div class="top-main">
    <div class="live"><i id="dot"></i><span id="liveLabel">ACQUIRING…</span></div>
    <h1 id="placeName">SKYFALL</h1>
    <div class="coords" id="coords"></div>
  </div>
  <button class="sq" id="btnInstall" aria-label="Install app" hidden><svg viewBox="0 0 22 22"><path d="M11 3v11M6.5 9.5 11 14l4.5-4.5M4 18h14"/></svg></button>
  <button class="sq" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 22 22"><path d="M11 1.5l1.6 2.3 2.7-.8.5 2.8 2.7.9-.9 2.7 2.3 1.6-2.3 1.6.9 2.7-2.7.9-.5 2.8-2.7-.8L11 20.5l-1.6-2.3-2.7.8-.5-2.8-2.7-.9.9-2.7L2.1 11l2.3-1.6-.9-2.7 2.7-.9.5-2.8 2.7.8z"/><circle cx="11" cy="11" r="2.6"/></svg></button>
  <button class="sq" id="btnAmbient" aria-label="Ambient mode"><svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="4.4"/><path d="M0 15.8h22" /><path d="M3.3 18.9h15.4" stroke-opacity=".5" stroke-width="1"/></svg></button>
  <button class="sq" id="btnSearch" aria-label="Search places"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></button>
</header>

<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="alerts" role="alert" hidden></div>

<main id="pager" aria-live="off">
  <section class="page" id="p-core" data-tab="CORE"></section>
  <section class="page" id="p-scan" data-tab="24H"></section>
  <section class="page" id="p-traj" data-tab="10D"></section>
  <section class="page" id="p-data" data-tab="DATA"></section>
  <section class="page" id="p-golf" data-tab="GOLF"></section>
  <section class="page" id="p-air" data-tab="AIR"></section>
  <section class="page" id="p-intel" data-tab="NEWS"></section>
</main>

<nav id="dock" aria-label="Sections"></nav>

<div id="search" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Acquire location">
  <div class="sheet">
    <div class="sheet-head"><span>ACQUIRE // TARGET</span><button class="txt" id="searchClose">[CLOSE]</button></div>
    <input id="q" type="search" placeholder="CITY / TOWN" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button class="wide" id="useGps">◎ USE CURRENT LOCATION</button>
    <div id="results"></div>
  </div>
</div>

<div id="settings" role="dialog" aria-modal="true" aria-label="Settings" hidden></div>
<div id="ambient" class="overlay ambient" hidden>
  <div class="amb-read"><div id="ambTemp"></div><div id="ambSky" class="mono"></div><div id="ambClock" class="mono"></div></div>
  <button class="txt amb-close" id="ambClose">[EXIT AMBIENT]</button>
</div>

<script src="catalog.js?v=33"></script>
<script src="logic.js?v=33"></script>
<script src="city.js?v=33"></script>
<script src="scene.js?v=33"></script>
<script src="core.js?v=33"></script>
<script src="intel.js?v=33"></script>
<script src="app.js?v=33"></script>
</body>
</html>
